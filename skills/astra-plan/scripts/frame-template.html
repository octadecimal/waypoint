<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astra UI Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    :root {
      color-scheme: light dark;
      --bg-primary: #f5f5f7; --bg-secondary: #fff; --bg-tertiary: #e5e5e7;
      --border: #d1d1d6; --text-primary: #1d1d1f; --text-secondary: #66666b;
      --text-tertiary: #8e8e93; --accent: #5b5bd6; --success: #248a3d;
      --warning: #b25000; --error: #d70015; --selected-bg: #ededff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1d1d1f; --bg-secondary: #2d2d2f; --bg-tertiary: #3d3d3f;
        --border: #515154; --text-primary: #f5f5f7; --text-secondary: #b0b0b5;
        --text-tertiary: #8e8e93; --accent: #8e8eff; --success: #30d158;
        --warning: #ff9f0a; --error: #ff453a; --selected-bg: rgba(142,142,255,.15);
      }
    }
    body { font-family: system-ui, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.5; }
    .header { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 1rem; min-height: 42px; padding: .55rem 1.5rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border); }
    .brand { color: var(--text-secondary); font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status { --status-color: var(--text-tertiary); display: flex; align-items: center; gap: .4rem; color: var(--status-color); font-size: .72rem; white-space: nowrap; }
    .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--status-color); }
    #frame-content { width: min(1180px, 100%); min-height: calc(100vh - 42px); margin: 0 auto; padding: 2rem; }
    h2 { margin-bottom: .5rem; font-size: 1.5rem; } h3 { margin-bottom: .25rem; font-size: 1rem; }
    .subtitle { margin-bottom: 1.5rem; color: var(--text-secondary); }
    .section { margin-bottom: 2rem; } .label { margin-bottom: .5rem; color: var(--text-secondary); font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; }
    .options { display: flex; flex-direction: column; gap: .75rem; }
    .option { display: flex; align-items: flex-start; gap: 1rem; padding: 1rem 1.25rem; cursor: pointer; background: var(--bg-secondary); border: 2px solid var(--border); border-radius: 12px; transition: .15s ease; }
    .option:hover, .option:focus-within { border-color: var(--accent); }
    .option:focus-visible, .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .option.selected { background: var(--selected-bg); border-color: var(--accent); }
    .option .letter { display: grid; flex: 0 0 1.75rem; height: 1.75rem; place-items: center; border-radius: 6px; background: var(--bg-tertiary); color: var(--text-secondary); font-weight: 600; }
    .option.selected .letter { background: var(--accent); color: #fff; }
    .option .content { flex: 1; } .option p, .card p { color: var(--text-secondary); font-size: .88rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .card { overflow: hidden; cursor: pointer; background: var(--bg-secondary); color: inherit; border: 2px solid var(--border); border-radius: 12px; font: inherit; text-align: left; transition: .15s ease; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); } .card.selected { border-color: var(--accent); }
    .card-image { display: grid; aspect-ratio: 16/10; place-items: center; background: var(--bg-tertiary); }
    .card-body { display: block; padding: 1rem; }
    .card-body > span { display: block; margin-top: .25rem; color: var(--text-secondary); font-size: .88rem; }
    .mockup { overflow: hidden; margin-bottom: 1.5rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; }
    .mockup-header { padding: .5rem 1rem; background: var(--bg-tertiary); border-bottom: 1px solid var(--border); color: var(--text-secondary); font-size: .78rem; }
    .mockup-body { padding: 1.5rem; }
    .split, .pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .pros, .cons { padding: 1rem; background: var(--bg-secondary); border-radius: 8px; }
    .pros h4 { color: var(--success); } .cons h4 { color: var(--error); }
    .pros ul, .cons ul { margin-left: 1.25rem; color: var(--text-secondary); }
    .placeholder { padding: 2rem; text-align: center; color: var(--text-tertiary); background: var(--bg-tertiary); border: 2px dashed var(--border); border-radius: 8px; }
    .mock-nav { display: flex; gap: 1.5rem; padding: .75rem 1rem; background: var(--accent); color: #fff; }
    .mock-sidebar { min-width: 180px; padding: 1rem; background: var(--bg-tertiary); }
    .mock-content { flex: 1; padding: 1.5rem; }
    .mock-button { padding: .5rem 1rem; border: 0; border-radius: 6px; background: var(--accent); color: #fff; }
    .mock-input { width: 100%; padding: .5rem; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 6px; }
    @media (max-width: 700px) { #frame-content { padding: 1rem; } .split, .pros-cons { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="header"><div class="brand">Astra workflow preview</div><div class="status">Connecting…</div></div>
  <main id="frame-content"><!-- CONTENT --></main>
</body>
</html>
